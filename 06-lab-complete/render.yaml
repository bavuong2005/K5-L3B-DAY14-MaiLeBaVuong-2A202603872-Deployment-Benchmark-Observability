services:
  - type: web
    name: k5-day14-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: k5-day14-cache
          property: connectionString
      - key: ENVIRONMENT
        value: production
  - type: keyvalue
    name: k5-day14-cache
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
